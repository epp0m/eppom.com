<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Min Nettside</title>
</head>
<body>

<h1>Her er innholdet fra den andre siden:</h1>

<!-- Boksen hvor den eksterne siden skal vises -->
<div id="eksternt-innhold">Laster innhold...</div>

<script>
    // Hent koden som PHP-proxyen har lastet ned
    fetch('proxy.php')
        .then(response => response.text())
        .then(data => {
            document.getElementById('eksternt-innhold').innerHTML = data;
        })
        .catch(error => console.error('Feil under lasting:', error));
</script>

</body>
</html>
